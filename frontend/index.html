<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BFHL Tree Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --border: #2a2a3d;
    --accent: #7c6af7;
    --accent2: #e84393;
    --accent3: #00d4aa;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --error: #ff5555;
    --success: #50fa7b;
    --warn: #ffb86c;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  .orb1 { width: 400px; height: 400px; background: rgba(124,106,247,0.12); top: -100px; right: -100px; animation: drift1 8s ease-in-out infinite; }
  .orb2 { width: 300px; height: 300px; background: rgba(232,67,147,0.08); bottom: 100px; left: -50px; animation: drift2 10s ease-in-out infinite; }

  @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,30px); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-20px); } }

  .container {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .logo-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 3px;
    padding: 6px 14px;
    border-radius: 4px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    margin-top: 10px;
    font-size: 15px;
    font-weight: 300;
  }

  /* Input Card */
  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 28px;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .input-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  .api-url-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    align-items: center;
  }

  .api-url-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--accent3);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .api-url-input:focus { border-color: var(--accent3); }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    resize: vertical;
    min-height: 140px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 24px;
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #9b55f5);
    color: #fff;
    box-shadow: 0 4px 20px rgba(124,106,247,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,106,247,0.5); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .loading .spinner { display: block; }
  .loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error-box {
    background: rgba(255,85,85,0.1);
    border: 1px solid rgba(255,85,85,0.3);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--error);
    font-family: var(--mono);
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
    animation: fadeUp 0.3s ease;
  }

  /* Results */
  #results { animation: fadeUp 0.5s ease both; }

  .section-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* Summary bar */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: var(--accent); }

  .stat-value {
    font-size: 32px;
    font-weight: 800;
    font-family: var(--mono);
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Identity row */
  .identity-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 28px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .id-item { display: flex; flex-direction: column; gap: 3px; }
  .id-label { color: var(--muted); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
  .id-value { color: var(--accent3); }

  /* Hierarchies */
  .tree-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .tree-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    transition: border-color 0.2s, transform 0.2s;
    animation: popIn 0.4s ease both;
  }
  .tree-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tree-card.cyclic { border-color: rgba(255,85,85,0.3); }
  .tree-card.cyclic:hover { border-color: var(--error); }

  .tree-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .root-label {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .root-node {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #9b55f5);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    box-shadow: 0 3px 12px rgba(124,106,247,0.4);
  }
  .cyclic .root-node {
    background: linear-gradient(135deg, #ff5555, #ff8c00);
    box-shadow: 0 3px 12px rgba(255,85,85,0.4);
  }

  .root-info { display: flex; flex-direction: column; }
  .root-name { font-weight: 700; font-size: 15px; }
  .root-sub { font-size: 11px; color: var(--muted); }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 1px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-cycle { background: rgba(255,85,85,0.15); color: var(--error); border: 1px solid rgba(255,85,85,0.3); }
  .badge-depth { background: rgba(124,106,247,0.15); color: var(--accent); border: 1px solid rgba(124,106,247,0.3); }

  /* Tree visualization */
  .tree-visual {
    background: var(--surface2);
    border-radius: 8px;
    padding: 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.8;
    color: var(--text);
    overflow-x: auto;
  }
  .tree-node-line { white-space: pre; }
  .tree-branch { color: var(--muted); }
  .tree-node { color: var(--accent3); font-weight: 700; }
  .cycle-msg { color: var(--error); font-style: italic; }

  /* Tags */
  .tags-section {
    margin-bottom: 24px;
  }
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
  }
  .tag-invalid { background: rgba(255,85,85,0.1); color: var(--error); border: 1px solid rgba(255,85,85,0.25); }
  .tag-duplicate { background: rgba(255,184,108,0.1); color: var(--warn); border: 1px solid rgba(255,184,108,0.25); }
  .tag-empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 0; background: none; border: none; }

  /* Raw JSON toggle */
  .raw-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-top: 28px;
  }
  .raw-header {
    padding: 14px 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    user-select: none;
    transition: background 0.2s;
  }
  .raw-header:hover { background: var(--surface2); color: var(--text); }
  .raw-body {
    display: none;
    padding: 16px 20px;
    background: var(--surface2);
    overflow-x: auto;
  }
  .raw-body.open { display: block; }
  pre {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--accent3);
    white-space: pre;
  }

  /* Animations */
  @keyframes fadeDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform:none; } }
  @keyframes popIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<div class="container">
  <header>
    <div class="logo-badge">SRM · BFHL Challenge</div>
    <h1>Tree Hierarchy<br>Analyzer</h1>
    <p class="subtitle">Parse hierarchical node relationships · Detect cycles · Visualize trees</p>
  </header>

  <div class="input-card">
    <span class="input-label">API Endpoint</span>
    <div class="api-url-row">
      <input class="api-url-input" id="apiUrl" type="text" value="https://bajaj-finserv-srm-challenge-backend.onrender.com/bfhl" placeholder="https://your-api.onrender.com/bfhl" />
    </div>

    <span class="input-label">Node Array (comma or newline separated)</span>
    <textarea id="nodeInput" placeholder='e.g. A->B, A->C, B->D, X->Y, Y->Z, Z->X, hello, 1->2'></textarea>

    <div class="btn-row">
      <button class="btn btn-primary" id="submitBtn" onclick="analyze()">
        <div class="spinner"></div>
        <span class="btn-text">▶ &nbsp;Analyze</span>
      </button>
      <button class="btn btn-ghost" onclick="loadExample()">Load Example</button>
      <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div id="results" class="hidden"></div>
</div>

<script>
function loadExample() {
  document.getElementById('nodeInput').value =
    'A->B, A->C, B->D, C->E, E->F,\nX->Y, Y->Z, Z->X,\nP->Q, Q->R,\nG->H, G->H, G->I,\nhello, 1->2, A->';
}

function clearAll() {
  document.getElementById('nodeInput').value = '';
  document.getElementById('results').classList.add('hidden');
  document.getElementById('errorBox').style.display = 'none';
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
}

async function analyze() {
  const input = document.getElementById('nodeInput').value.trim();
  const apiUrl = document.getElementById('apiUrl').value.trim();
  const btn = document.getElementById('submitBtn');

  if (!input) { showError('Please enter some node data first.'); return; }
  if (!apiUrl) { showError('Please enter your API URL.'); return; }

  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('results').classList.add('hidden');
  btn.classList.add('loading');
  btn.disabled = true;

  // Parse input to array
  const data = input.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);

  try {
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data })
    });

    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`HTTP ${res.status}: ${txt}`);
    }

    const json = await res.json();
    renderResults(json);
  } catch (err) {
    showError(err.message || 'Failed to connect to API. Check the URL and CORS settings.');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function renderResults(data) {
  const el = document.getElementById('results');
  el.classList.remove('hidden');

  const {
    user_id,
    email_id,
    college_roll_number,
    hierarchies = [],
    invalid_entries = [],
    duplicate_edges = [],
    summary = {}
  } = data;

  el.innerHTML = `
    <div class="section-title">Identity</div>
    <div class="identity-row">
      <div class="id-item"><span class="id-label">User ID</span><span class="id-value">${esc(user_id)}</span></div>
      <div class="id-item"><span class="id-label">Email</span><span class="id-value">${esc(email_id)}</span></div>
      <div class="id-item"><span class="id-label">Roll No</span><span class="id-value">${esc(college_roll_number)}</span></div>
    </div>

    <div class="section-title">Summary</div>
    <div class="summary-grid">
      <div class="stat-card">
        <div class="stat-value">${hierarchies.length}</div>
        <div class="stat-label">Total Groups</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--accent3)">${summary.total_trees ?? 0}</div>
        <div class="stat-label">Valid Trees</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--error)">${summary.total_cycles ?? 0}</div>
        <div class="stat-label">Cyclic Groups</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--accent2)">${esc(summary.largest_tree_root ?? '—')}</div>
        <div class="stat-label">Largest Tree Root</div>
      </div>
    </div>

    <div class="section-title">Hierarchies (${hierarchies.length})</div>
    <div class="tree-grid">
      ${hierarchies.map(renderTree).join('')}
    </div>

    <div class="section-title">Invalid Entries (${invalid_entries.length})</div>
    <div class="tags-section">
      <div class="tag-list">
        ${invalid_entries.length
          ? invalid_entries.map(e => `<span class="tag tag-invalid">${esc(e)}</span>`).join('')
          : '<span class="tag tag-empty">None</span>'}
      </div>
    </div>

    <div class="section-title">Duplicate Edges (${duplicate_edges.length})</div>
    <div class="tags-section">
      <div class="tag-list">
        ${duplicate_edges.length
          ? duplicate_edges.map(e => `<span class="tag tag-duplicate">${esc(e)}</span>`).join('')
          : '<span class="tag tag-empty">None</span>'}
      </div>
    </div>

    <div class="raw-toggle">
      <div class="raw-header" onclick="toggleRaw(this)">
        <span>{ } Raw JSON Response</span>
        <span>▼ expand</span>
      </div>
      <div class="raw-body">
        <pre>${esc(JSON.stringify(data, null, 2))}</pre>
      </div>
    </div>
  `;

  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderTree(h) {
  const isCyclic = h.has_cycle === true;
  return `
    <div class="tree-card ${isCyclic ? 'cyclic' : ''}">
      <div class="tree-header">
        <div class="root-label">
          <div class="root-node">${esc(h.root)}</div>
          <div class="root-info">
            <span class="root-name">Root: ${esc(h.root)}</span>
            <span class="root-sub">${isCyclic ? 'Cyclic group' : `Depth: ${h.depth}`}</span>
          </div>
        </div>
        ${isCyclic
          ? '<span class="badge badge-cycle">⟳ Cycle</span>'
          : `<span class="badge badge-depth">D:${h.depth}</span>`}
      </div>
      <div class="tree-visual">
        ${isCyclic
          ? '<span class="cycle-msg">⚠ Cycle detected — no tree structure</span>'
          : renderTreeLines(h.root, h.tree)}
      </div>
    </div>
  `;
}

function renderTreeLines(root, treeObj) {
  const lines = [];
  function walk(node, nodeObj, prefix, isLast) {
    const connector = prefix === '' ? '' : (isLast ? '└── ' : '├── ');
    lines.push(`<div class="tree-node-line"><span class="tree-branch">${esc(prefix + connector)}</span><span class="tree-node">${esc(node)}</span></div>`);
    const nextPrefix = prefix + (prefix === '' ? '' : (isLast ? '    ' : '│   '));
    const children = Object.keys(nodeObj || {});
    children.forEach((child, i) => {
      walk(child, nodeObj[child], nextPrefix, i === children.length - 1);
    });
  }
  const rootObj = treeObj && treeObj[root] ? treeObj[root] : {};
  walk(root, rootObj, '', true);
  return lines.join('');
}

function toggleRaw(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
  const arrow = header.querySelector('span:last-child');
  arrow.textContent = body.classList.contains('open') ? '▲ collapse' : '▼ expand';
}

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Allow Enter in textarea to not submit
document.getElementById('nodeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) analyze();
});
</script>
</body>
</html>
